annotation_path: data/source/coco/annotations/instances_selected.json
images_dir: data/source/coco/images
split: train
absent_per_positive: 2
max_samples: 10000
transform_images_dir: data/derived/coco/train
min_box_side: 8
min_box_area: 64
metamorphic:
  enabled_relations:
  - T1
  - T2
  - T3
  - T4
  - T5
  - T7
  removal_operators:
  - gaussian_blur
  - mean_replace
  region_ladder: true
  region_ladder_levels:
  - 1.0
  - 0.75
  - 0.5
  - 0.25
  - 0.0
  region_ladder_answer_threshold: 0.5
  collinearity_break: true
