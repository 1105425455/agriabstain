images_dir: benchmark/data/source/plantdoc/images
labels_dir: benchmark/data/source/plantdoc/labels
split: train
image_extensions:
  - .jpg
  - .jpeg
  - .png

class_names:
  - apple_scab_leaf
  - apple_leaf
  - apple_rust_leaf
  - bell_pepper_leaf
  - bell_pepper_leaf_spot
  - blueberry_leaf
  - cherry_leaf
  - corn_gray_leaf_spot
  - corn_leaf_blight
  - corn_rust_leaf
  - peach_leaf
  - potato_leaf_late_blight
  - raspberry_leaf
  - soybean_leaf
  - plantdoc_unverified_class_14
  - squash_powdery_mildew_leaf
  - strawberry_leaf
  - tomato_early_blight_leaf
  - tomato_septoria_leaf_spot
  - tomato_leaf
  - tomato_leaf_bacterial_spot
  - tomato_leaf_late_blight
  - tomato_leaf_mosaic_virus
  - tomato_leaf_yellow_virus
  - tomato_mold_leaf
  - grape_leaf

# Pre-split capability-controlled label space. See
# benchmark/annotations/audits/PLANTDOC_CAPABILITY_GATE_AUDIT.json.
# The raw Qwen3-VL-8B audit used all 768 base records before the later
# source-image train/dev/test split. Four observed labels with correct_rate<0.40
# are excluded, together with one unverified placeholder class:
#   14 = unverified placeholder class (absent from calibration records)
#    4 = bell_pepper_leaf_spot (0.35)
#    5 = blueberry_leaf (0.33)
#   19 = tomato_leaf (0.22; a generic leaf label, so its localisation target is ambiguous)
#   22 = tomato_leaf_mosaic_virus (0.00)
# The calibration pool contains 24 observed labels; excluding four leaves the
# 20 observed agricultural labels used by the benchmark. Excluded labels are
# also removed from the T5 absent / T6 mismatch spaces.
excluded_class_ids:
  - 4
  - 5
  - 14
  - 19
  - 22

require_unique_class_per_image: true

# T5 is capped so that target-absent records do not dominate: each positive draws 4 absent
# categories, deterministically and seeded per group. Over 20 categories this gives roughly
# 726x4 = 2.9k records, comparable to T4 and T7 together, so the mixture stays centred on
# evidence rather than on mere absence. Setting this to "all" removes the cap.
absent_per_positive: 4
max_samples:

transform_images_dir: benchmark/data/derived/plantdoc/train

metamorphic:
  enabled_relations:
    - T1  # paraphrase invariance
    - T2  # photometric preservation
    - T3  # geometric equivariance
    - T4  # evidence removal
    - T5  # target-absent swap
    - T6  # same-crop confusable query; hard visual contradiction (wrong_object)
    - T7  # region monotonicity (include + 5-level visibility ladder)
  removal_operators:
    - gaussian_blur
    - mean_replace
    - pixelate
  target_removal_source: region_include_crop
  region_exclude_min_area_ratio: 0.25
  region_exclude_skip_labels:
    - apple_leaf
    - bell_pepper_leaf
    - blueberry_leaf
    - cherry_leaf
    - grape_leaf
    - peach_leaf
    - raspberry_leaf
    - soybean_leaf
    - strawberry_leaf
    - tomato_leaf
  # The five levels of the L3 visibility ladder
  region_ladder: true
  region_ladder_levels: [1.0, 0.75, 0.5, 0.25, 0.0]
  region_ladder_answer_threshold: 0.5
  collinearity_break: true
  # Degradation strengths for T4
  blur_radii_visible: [2, 4]
  blur_radii_occluded: [6, 8]
  pixelate_blocks_visible: [4, 6]
  pixelate_blocks_occluded: [10, 12]

# T6 query-image mismatch: the query names a visually similar but different category, which
# tests whether the model confuses one disease for a look-alike. Pairing rules:
#   - each source pairs with 3 to 5 different categories from the same morphology group, so
#     diversity comes from distinct pairs rather than from repetition
#   - the mismatch label must be one of the 20 observed labels and never an excluded one
#   - morphology groups: leaf spot (scab, septoria, bacterial_spot, gray_leaf_spot,
#     early_blight), rust (apple_rust, corn_rust), blight (corn_blight, potato_late,
#     tomato_late), mildew (powdery_mildew, mold), viral chlorosis (yellow_virus), and
#     healthy leaves (apple, bell_pepper, cherry, peach, raspberry, soybean, strawberry, grape)
# Current table uses only same-crop confusable alternatives. Cross-crop absent
# queries belong to T5 and are not included here.
mismatch_pairs:
  # --- tomato: five diseases of the same crop, paired with each other ---
  tomato_septoria_leaf_spot:
    - tomato_leaf_bacterial_spot
    - tomato_early_blight_leaf
    - tomato_leaf_late_blight
    - tomato_mold_leaf
  tomato_leaf_bacterial_spot:
    - tomato_septoria_leaf_spot
    - tomato_early_blight_leaf
    - tomato_leaf_late_blight
    - tomato_mold_leaf
  tomato_early_blight_leaf:
    - tomato_septoria_leaf_spot
    - tomato_leaf_bacterial_spot
    - tomato_leaf_late_blight
    - tomato_mold_leaf
  tomato_leaf_late_blight:
    - tomato_early_blight_leaf
    - tomato_septoria_leaf_spot
    - tomato_leaf_bacterial_spot
    - tomato_mold_leaf
  tomato_mold_leaf:
    - tomato_septoria_leaf_spot
    - tomato_early_blight_leaf
    - tomato_leaf_bacterial_spot
    - tomato_leaf_late_blight
  # --- corn: three diseases of the same crop, paired with each other ---
  corn_gray_leaf_spot:
    - corn_rust_leaf
    - corn_leaf_blight
  corn_rust_leaf:
    - corn_gray_leaf_spot
    - corn_leaf_blight
  corn_leaf_blight:
    - corn_gray_leaf_spot
    - corn_rust_leaf
  # --- apple: scab and rust paired with each other; the healthy leaf is not a disease look-alike ---
  apple_scab_leaf:
    - apple_rust_leaf
  apple_rust_leaf:
    - apple_scab_leaf
  # Cross-crop and healthy-leaf pairings are deliberately absent: visually they amount to a
  # missing target, which is T5 rather than a category contradiction. Crops with only one
  # disease category, such as potato, squash and grape, have no same-crop look-alike and so
  # do not appear in this table.
