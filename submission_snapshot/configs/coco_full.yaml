# Adjust these two paths after ModelScope finishes downloading.
annotation_path: benchmark/data/source/coco/annotations/instances_selected.json
images_dir: benchmark/data/source/coco/images
split: train

# T5 is capped: each positive draws 2 absent categories, deterministically and seeded per
# group, instead of enumerating all 80 COCO categories.
absent_per_positive: 2
# First train shard. Increase or remove this after verifying storage/time.
max_samples: 10000

transform_images_dir: benchmark/data/derived/coco/train

# Degenerate-box filter, as in the PlantDoc config: very small boxes are unlocatable noise.
min_box_side: 8
min_box_area: 64

metamorphic:
  enabled_relations:
    - T1  # paraphrase invariance
    - T2  # photometric preservation
    - T3  # geometric equivariance
    - T4  # evidence removal
    - T5  # target-absent swap
    - T7  # region monotonicity (include + 4-level visibility ladder)
  removal_operators:
    - gaussian_blur
    - mean_replace
  # T7 severity ladder: crop inward by the visible fraction of the target, anchored on geometry.
  region_ladder: true
  region_ladder_levels: [1.0, 0.75, 0.5, 0.25, 0.0]
  region_ladder_answer_threshold: 0.5
  collinearity_break: true
