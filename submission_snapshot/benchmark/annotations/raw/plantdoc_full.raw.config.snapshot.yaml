  - T2
  - T3
  - T4
  - T5
  - T6
  - T7
  removal_operators:
  - gaussian_blur
  - mean_replace
  - pixelate
  target_removal_source: region_include_crop
  region_exclude_min_area_ratio: 0.25
  region_exclude_skip_labels:
  - apple_leaf
  - bell_pepper_leaf
  - blueberry_leaf
  - cherry_leaf
  - grape_leaf
  - peach_leaf
  - raspberry_leaf
  - soybean_leaf
  - strawberry_leaf
  - tomato_leaf
  region_ladder: true
  region_ladder_levels:
  - 1.0
  - 0.75
  - 0.5
  - 0.25
  - 0.0
  region_ladder_answer_threshold: 0.5
  collinearity_break: true
  blur_radii_visible:
  - 2
  - 4
  blur_radii_occluded:
  - 6
  - 8
  pixelate_blocks_visible:
  - 4
  - 6
  pixelate_blocks_occluded:
  - 10
  - 12
